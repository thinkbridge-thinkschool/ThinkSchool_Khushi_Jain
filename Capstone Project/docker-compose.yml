# SQL Server for DocBook, on 11434 so the QuotesLab container on 11433 is left alone.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: docbook-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # The password lives in the shell session, never here.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in your shell before running - see day27_security/README.md}
    ports:
      - "11434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
