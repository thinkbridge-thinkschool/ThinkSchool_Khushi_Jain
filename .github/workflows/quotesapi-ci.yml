name: QuotesApi CI

on:
  push:
    branches:
      - main
    paths:
      - "Day1/QuotesApi/**"
      - "Day1/QuotesApi.Tests/**"
      - ".github/workflows/quotesapi-ci.yml"
  pull_request:
    paths:
      - "Day1/QuotesApi/**"
      - "Day1/QuotesApi.Tests/**"
      - ".github/workflows/quotesapi-ci.yml"

jobs:
  build-and-test:
    # GitHub-hosted ubuntu-latest runners come with a working Docker daemon,
    # which is all Testcontainers needs to start the SQL Server 2022 container
    # used by the SqlServer integration tests -- no docker-compose or extra
    # `services:` block required.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Day1/QuotesApi.Tests/QuotesApi.Tests.csproj

      - name: Build
        run: dotnet build Day1/QuotesApi.Tests/QuotesApi.Tests.csproj --no-restore

      - name: Run tests (SQLite + Testcontainers SQL Server)
        run: dotnet test Day1/QuotesApi.Tests/QuotesApi.Tests.csproj --no-build --logger "console;verbosity=normal"
